[project]
name = "cascadedlp"
version = "0.1.0"
description = "로컬 GPU와 클라우드 모델을 나눠 쓰는 하이브리드 캐스케이딩 DLP 레이어 (한·일·영)"
requires-python = ">=3.12"
dependencies = ["requests"]

[project.optional-dependencies]
mcp = ["mcp>=2.2"]

[project.scripts]
cascadedlp = "cascadedlp.cli:main"
cascadedlp-mcp = "cascadedlp.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cascadedlp"]
